# setup-maruhi — a composite action that installs the maruhi CLI onto GitHub
# Actions.
#
# It installs from the release artifacts (binaries + checksums.txt from the
# tag-driven CI — ADR-0015) by reusing packaging/install.sh: the properties of
# not writing anything to the install destination until SHA-256 verification
# passes and leaving no partial files on failure are not reimplemented here
# (the action's checkout contains the whole repository, so the script is
# reachable relative to $GITHUB_ACTION_PATH).
#
# Marketplace publication coincides with the Phase 2 public release
# (docs/notes/session-25.md). Usage is in the same directory's README.md
# (English).

name: "setup-maruhi"
description: >-
  Install the maruhi CLI from GitHub release assets with mandatory SHA-256
  checksum verification. Use together with `maruhi ci run`, which needs
  `permissions: id-token: write` on the job (see this action's README).
author: "maruhi"

inputs:
  version:
    description: >-
      maruhi version tag to install (example: v0.1.0-rc.1). Required while no
      stable release exists — during the pre-release period releases/latest
      cannot be resolved, so the install script refuses to guess.
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Install maruhi
      shell: bash
      env:
        MARUHI_SETUP_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        install_dir="${RUNNER_TEMP}/maruhi-bin"
        args=(--dir "${install_dir}")
        if [ -n "${MARUHI_SETUP_VERSION}" ]; then
          args+=(--version "${MARUHI_SETUP_VERSION}")
        fi
        sh "${GITHUB_ACTION_PATH}/../../packaging/install.sh" "${args[@]}"
        echo "${install_dir}" >> "${GITHUB_PATH}"
