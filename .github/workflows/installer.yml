name: installer

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

env:
  DO_NOT_TRACK: "1"
  WRANGLER_SEND_METRICS: "false"
  CF_SEND_TELEMETRY: "false"

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shellcheck (install script + test harness)
        run: |
          shellcheck --shell=sh packaging/install.sh
          shellcheck packaging/install-test.sh

      - uses: ./.github/actions/install-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve version (single source = apps/cli/package.json)
        id: version
        run: |
          VERSION=$(node -p "require('./apps/cli/package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Export unix install matrix (single source = scripts/shared.ts)
        id: matrix
        run: |
          set -o pipefail
          MATRIX=$(bun apps/cli/scripts/print-smoke-matrix.ts |
            jq -c '[.[] | select(.target | startswith("windows") | not)]')
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

      - name: Build binaries + checksums
        run: bun run --filter @maruhi/cli build:binaries

      - name: Generate + syntax-check Homebrew formula
        run: |
          bun apps/cli/scripts/generate-formula.ts \
            --checksums apps/cli/dist/checksums.txt \
            --allow-prerelease \
            --out "${RUNNER_TEMP}/maruhi.rb"
          ruby -c "${RUNNER_TEMP}/maruhi.rb"
          ruby -c packaging/homebrew/maruhi.example.rb

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-fixtures
          path: apps/cli/dist/
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  install:
    name: install (${{ matrix.target }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.build.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installer-fixtures
          path: fixtures

      - name: install.sh end-to-end (positive + tampered negative cases)
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          bash packaging/install-test.sh \
            --dist fixtures \
            --target "${TARGET}" \
            --version "${VERSION}"

  action-smoke:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installer-fixtures
          path: fixtures

      - name: Point the installer at the local fixtures
        run: echo "MARUHI_BASE_URL=file://${GITHUB_WORKSPACE}/fixtures" >> "$GITHUB_ENV"

      - uses: ./actions/setup-maruhi
        with:
          version: ${{ needs.build.outputs.version }}

      - name: Installed binary is on PATH (with the mh alias)
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          command -v maruhi
          test "$(maruhi --version)" = "${VERSION}"
          test "$(mh --version)" = "${VERSION}"
