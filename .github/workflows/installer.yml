# Validation of the install script (packaging/install.sh) and the Homebrew formula.
#
# Does not depend on a real release: the `build:binaries` artifacts are handed to
# real OS runners and install.sh is actually run against local http / file://
# (positive cases + tampered negative cases). Even with nothing published to
# GitHub Releases yet, this workflow alone exercises "installs / refuses to
# install when tampered".
#
# Target runners are the same table as release.yml's smoke (TARGETS in
# scripts/shared.ts) minus windows — 4 targets. Agreement with install.sh's own
# table is pinned by apps/cli/test/installer.test.ts.
#
# External actions are pinned by commit SHA (same discipline as release.yml).
name: installer

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

env:
  # Apply the "say nothing" principle (CLAUDE.md) as in ci.yml / release.yml
  DO_NOT_TRACK: "1"
  WRANGLER_SEND_METRICS: "false"
  CF_SEND_TELEMETRY: "false"

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Artifacts for validation (built via the same path as the release) and
  # static checks of the shell script and formula
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
    steps:
      # Leave no token on jobs that run dependency code (bun install / build)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Preinstalled on the ubuntu runner (adds no new dependency).
      # install.sh is checked as POSIX sh — this script's premise is that it
      # does not break even when the executing shell is dash / busybox
      - name: Shellcheck (install script + test harness)
        run: |
          shellcheck --shell=sh packaging/install.sh
          shellcheck packaging/install-test.sh

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve version (single source = apps/cli/package.json)
        id: version
        run: |
          VERSION=$(node -p "require('./apps/cli/package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # The single source for the target table is scripts/shared.ts. Here we only
      # drop windows; the list itself is not duplicated into YAML (same
      # derivation as release.yml's smoke)
      - name: Export unix install matrix (single source = scripts/shared.ts)
        id: matrix
        run: |
          MATRIX=$(bun apps/cli/scripts/print-smoke-matrix.ts |
            jq -c '[.[] | select(.target | startswith("windows") | not)]')
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

      - name: Build binaries + checksums
        run: bun run --filter @maruhi/cli build:binaries

      # Build the formula from the real checksums.txt and syntax-check it with
      # ruby. The example (golden) side's syntax is checked at the same time —
      # the generator's output shape is pinned by apps/cli/test/installer.test.ts
      # matching the example
      - name: Generate + syntax-check Homebrew formula
        run: |
          bun apps/cli/scripts/generate-formula.ts \
            --checksums apps/cli/dist/checksums.txt \
            --allow-prerelease \
            --out "${RUNNER_TEMP}/maruhi.rb"
          ruby -c "${RUNNER_TEMP}/maruhi.rb"
          ruby -c packaging/homebrew/maruhi.example.rb

      # Ship all targets in one artifact (same reason as release.yml's smoke:
      # splitting per target pushes a duplicate of the target list back into the
      # upload side)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer-fixtures
          path: apps/cli/dist/
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # Install on real OSes. packaging/install-test.sh runs the positive cases
  # (http / file://, reinstall, someone else's mh) and the negative cases
  # (one-character checksums tampering, one-byte archive tampering, missing
  # asset, version mismatch)
  install:
    name: install (${{ matrix.target }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.build.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: installer-fixtures
          path: fixtures

      # Do not expand `${{ }}` directly into run (go through env) — GitHub's
      # hardening guidance
      - name: install.sh end-to-end (positive + tampered negative cases)
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          bash packaging/install-test.sh \
            --dist fixtures \
            --target "${TARGET}" \
            --version "${VERSION}"

  # Actually run the setup-maruhi action (actions/setup-maruhi) **via a local
  # path reference**. The install job above checks install.sh on its own, but
  # the action/script coupling (passing --dir / --version, the binary's
  # location inside the archive, appending to GITHUB_PATH) is only exercised
  # here — this detects in CI the shape where a flag rename or layout change on
  # the script side breaks only the action's users (PR #79 pullfrog review
  # feedback).
  # Does not depend on a real release: build's artifacts are supplied via
  # MARUHI_BASE_URL (file://)
  action-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: installer-fixtures
          path: fixtures

      # The job env also reaches the composite action's steps (the mirror
      # setting for install.sh — nothing ever goes to GitHub Releases)
      - name: Point the installer at the local fixtures
        run: echo "MARUHI_BASE_URL=file://${GITHUB_WORKSPACE}/fixtures" >> "$GITHUB_ENV"

      - uses: ./actions/setup-maruhi
        with:
          version: ${{ needs.build.outputs.version }}

      - name: Installed binary is on PATH (with the mh alias)
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          command -v maruhi
          test "$(maruhi --version)" = "${VERSION}"
          test "$(mh --version)" = "${VERSION}"
