# Tag-driven release (ADR-0015 / docs/RELEASING.md)
#
# On push of a `v*` tag: quality gate (reuses ci.yml wholesale) → tag ↔
# apps/cli version match check → bun compile binaries for 5 targets →
# real-machine smoke (5 OS runners) → GitHub Release (with checksums.txt) →
# npm publish (trusted publishing + provenance). Each publish job waits for
# a reviewer's approval in the `release` environment.
# workflow_dispatch is a dry run: everything except publish runs (for
# verifying the plumbing before tagging).
#
# Operational invariants:
# - publish comes after all gates (verify / version-check / smoke). A broken
#   build does not ship even if tagged
# - Tags are never re-cut (overwriting an existing Release fails in
#   gh release create). To redo, advance the rc (docs/RELEASING.md)
# - Tags are only valid on commits in the main ancestry (version-check
#   enforces this — it closes the path where tagging an unreviewed branch
#   commit with a v tag reaches publish)
# - The publish jobs ship only artifacts whose digest matches the build
#   job's outputs (any job of the run can overwrite an artifact, but only
#   build can set its outputs)
# - External actions are pinned by commit SHA (this is a privileged path with
#   contents: write / id-token: write, so upstream compromise via a mutable
#   tag is ruled out. Same discipline as ADR-0011's strict pinning — updates
#   happen deliberately in a dedicated PR that bumps the SHA)
name: release

on:
  push:
    # With `v*`, unrelated tags like vendor-... would also run the full CI
    tags: ["v[0-9]*"]
  # Dry run (up through build + smoke + checksums; no publish)
  workflow_dispatch:

# Do not rely on the default loose permissions. State the minimum per job
permissions: {}

# Serialize so that reruns or rapid repeats of the same tag never run publish
# in parallel. cancel-in-progress is not used: killing a run mid-publish could
# leave GitHub Release and npm in a diverged half-state
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Apply the "say nothing" principle (CLAUDE.md) to the release path as in ci.yml
  DO_NOT_TRACK: "1"
  WRANGLER_SEND_METRICS: "false"
  CF_SEND_TELEMETRY: "false"

jobs:
  # The full quality gate (bun audit + 11 steps). Calls ci.yml via workflow_call.
  # No job of the release run restores an Actions cache (ci.yml has none: Bun
  # and the gate's browser are downloaded and checked against pinned
  # SHA-256s). An Actions cache entry in
  # the default branch's scope is writable by code in any run there (a push
  # to main and its dependencies, the Pullfrog agent's workflow_dispatch) —
  # GITHUB_TOKEN permissions do not limit cache writes — and tag runs read
  # that scope. Every job of this run, verify and build included, holds a
  # token that can overwrite the `binaries` / `npm-package` artifacts publish
  # downloads, so one poisoned entry could reach a published release. (A
  # dependency cache would be worse still — bun would install a cached hit
  # without re-verifying lockfile integrity — which is one reason none is
  # added; the other is that it measured slower than a cold install.)
  # apps/cli/test/workflows-supply-chain.test.ts keeps every workflow free of
  # Actions caches
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # The single source of truth for the version is apps/cli/package.json
  # (imported by cli.ts). If it does not match the tag, stop here (do not
  # build artifacts of a mismatched version)
  version-check:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The main-ancestry check (below) needs history
          fetch-depth: 0
          # Later git fetches only need unauthenticated access to a public
          # repository. Do not leave the token in .git/config (same discipline
          # as jobs that run dependency code)
          persist-credentials: false

      - name: Resolve version (tag ↔ apps/cli/package.json, ancestry)
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          VERSION=$(node -p "require('./apps/cli/package.json').version")
          # Canonical SemVer (same shape as SEMVER_PATTERN in
          # scripts/shared.ts). With a lax check, leading zeros etc. are first
          # rejected at the final npm publish and Release and npm diverge.
          # Later jobs expand this output into the shell, so the format check
          # doubles as injection hardening
          SEMVER_RE='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?$'
          if ! [[ "${VERSION}" =~ ${SEMVER_RE} ]]; then
            echo "::error::apps/cli/package.json version is not SemVer: ${VERSION}"
            exit 1
          fi
          if [ "${EVENT_NAME}" = "push" ] && [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match apps/cli/package.json version ${VERSION} (docs/RELEASING.md)"
            exit 1
          fi
          if [ "${EVENT_NAME}" = "push" ]; then
            # Force the tag to point at a commit in the main ancestry.
            # Without this, tagging any unreviewed branch commit with a v tag
            # would reach a real Release / npm publish (with provenance).
            # origin/main is already fetched by checkout (fetch-depth: 0 = all
            # branches, full history) — do not re-fetch here (a manual fetch
            # after persist-credentials: false is the one line that breaks the
            # moment the repository goes private)
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::error::tag ${GITHUB_REF_NAME} does not point at a commit on main (docs/RELEASING.md)"
              exit 1
            fi
          fi
          case "${VERSION}" in
            *-*) PRERELEASE=true ;;
            *) PRERELEASE=false ;;
          esac
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

  # Cross-compile the 5 targets and produce checksums.txt (generation is
  # centralized in scripts/build-binaries.ts; the build procedure is not
  # duplicated here)
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    needs: version-check
    permissions:
      contents: read
    outputs:
      smoke-matrix: ${{ steps.smoke-matrix.outputs.matrix }}
      binaries-digest: ${{ steps.digests.outputs.binaries }}
      npm-package-digest: ${{ steps.digests.outputs.npm-package }}
    steps:
      # Leave no token on jobs that run dependency code (bun install / build)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The running Bun bundles the published code and writes every artifact,
      # so it comes from the SHA-256-pinned zip, never a cache. The runtimes
      # embedded in the binaries are pinned separately, per target, in
      # apps/cli/scripts/bun-runtimes.ts
      - uses: ./.github/actions/install-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The smoke matrix is also derived from TARGETS (scripts/shared.ts):
      # adding a target automatically gains a real-OS smoke (this closes the
      # shape where a duplicated table forgets only the smoke side and an
      # artifact that passed nothing but cross-compiling gets published)
      - name: Export smoke matrix (single source = scripts/shared.ts)
        id: smoke-matrix
        run: |
          # A command substitution inside echo's arguments still lets echo
          # exit 0 on failure and breaks far downstream at fromJson(''). Go
          # through an assignment (failures propagate under -e)
          MATRIX=$(bun apps/cli/scripts/print-smoke-matrix.ts)
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

      - name: Build binaries + checksums
        run: bun run --filter @maruhi/cli build:binaries

      # npm staging is also built in the same job: permissions and trust level
      # (running dependency code under contents: read) are identical, so a
      # separate job buys nothing. The essential separation from publish-npm
      # (id-token isolation) is preserved
      - name: Stage npm package (bundle)
        run: bun run --filter @maruhi/cli build:npm

      # Bind what gets published to this job. Every job of this run holds a
      # token that can overwrite the artifacts below (upload-artifact needs
      # no permission), but only this job's steps can set its outputs. So the
      # publish jobs recompute this digest — every file's path and SHA-256 —
      # over what they downloaded and refuse a mismatch, and a compromised
      # verify / smoke job cannot swap what ships. The same digest function
      # runs there (pinned identical by apps/cli/test/workflows-supply-chain.test.ts)
      - name: Digest the artifacts (bound to this job's outputs)
        id: digests
        run: |
          set -euo pipefail
          digest() { (cd "$1" && find . ! -type d -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum --) | sha256sum | cut -d ' ' -f 1; }
          binaries=$(digest apps/cli/dist)
          npm_package=$(digest apps/cli/dist-npm)
          echo "binaries=${binaries}" >> "$GITHUB_OUTPUT"
          echo "npm-package=${npm_package}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binaries
          path: apps/cli/dist/
          if-no-files-found: error
          # The publish jobs download this after their approvals, and recovery
          # from a publish-npm-only failure re-runs the job (docs/RELEASING.md).
          # A re-run can start up to 30 days after the run and then wait up to
          # 30 days for its approval, so keep the artifacts 60 days
          retention-days: 60
          # A new "Re-run all jobs" attempt makes the same-named artifact 409;
          # with tag re-cutting banned, this closes the trap of having to burn
          # an rc
          overwrite: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-package
          path: apps/cli/dist-npm/
          if-no-files-found: error
          retention-days: 60
          overwrite: true

  # Real-machine smoke: cross-compiling only guarantees "it builds", so every
  # target is launched on a real OS runner. The target/runner list's single
  # source of truth is TARGETS in scripts/shared.ts (via the build job's
  # output through fromJSON)
  smoke:
    name: smoke (${{ matrix.target }})
    needs: [version-check, build]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.build.outputs.smoke-matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions: {}
    steps:
      # Download all archives (~150MB) and use just one. download-artifact v4
      # cannot fetch part of an artifact, and splitting into per-target
      # artifacts pushes a duplicate of the target list back into the upload
      # side and breaks the single source (shared.ts TARGETS). At 5 targets ×
      # infrequent releases the transfer cost is cheaper (revisit if the
      # target count grows)
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: binaries

      # Do not expand `${{ }}` directly into run (go through env): values like
      # the version string must not become an injection path interpreted as
      # shell (GitHub's hardening guidance)
      - name: Launch check (--version / --help)
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BIN: ${{ matrix.bin }}
          EXPECTED_VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          tar -xzf "maruhi-${TARGET}.tar.gz"
          GOT="$(./"${BIN}" --version)"
          echo "version: ${GOT}"
          test "${GOT}" = "${EXPECTED_VERSION}"
          ./"${BIN}" --help > /dev/null

      # Observe the OS keychain path. logout with no stored token exits 1 via
      # either "not in the keychain" (= backend reached OK) or a typed
      # backend-absent error — anything else (crash, signal death, unexpected
      # output) goes red. Runner keychain behavior (headless / unlocked) is
      # out of our control, so this is not a release gate (continue-on-error),
      # but red is readable as a real anomaly
      - name: Keychain probe (typed failure expected)
        continue-on-error: true
        shell: bash
        env:
          BIN: ${{ matrix.bin }}
        run: |
          set +e
          OUT=$(./"${BIN}" logout --server https://keychain-probe.invalid 2>&1)
          CODE=$?
          set -e
          echo "${OUT}"
          echo "exit: ${CODE}"
          # Emit the annotation via an explicit branch first (letting a bare
          # test fail under -e would drop without this step's purpose — the
          # crash-discrimination annotation — ever printing)
          if [ "${CODE}" != "1" ]; then
            echo "::warning::exited in a way that is not the typed-error exit 1 (exit ${CODE}; suspected crash / signal death)"
            exit 1
          fi
          case "${OUT}" in
            *keychain*) ;;
            *) echo "::warning::failed with output other than the keychain typed error"; exit 1 ;;
          esac

  # Both publish jobs run in the `release` environment, which must require a
  # reviewer and admit only v* tags (docs/RELEASING.md, first time): nothing
  # irreversible happens before a reviewer approves, and npm's
  # trusted-publisher entry names the environment. When a job references an
  # environment that does not exist, GitHub creates it with no protection at
  # all and runs the job, so this job reads the configuration and fails
  # closed before either publish job starts, on dry runs too. The
  # environment API needs actions: read; this job runs no checkout and no
  # action
  release-environment:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Require a reviewer and a v* tag policy on the release environment
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT: release
          TAG_PATTERN: "v[0-9]*"
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}/environments/${ENVIRONMENT}"
          if ! config=$(gh api "${api}"); then
            echo "::error::cannot read the ${ENVIRONMENT} environment; create it as docs/RELEASING.md describes"
            exit 1
          fi
          reviewers=$(jq '[.protection_rules[] | select(.type == "required_reviewers") | .reviewers[]] | length' <<< "${config}")
          if [ "${reviewers}" -lt 1 ]; then
            echo "::error::the ${ENVIRONMENT} environment has no required reviewer (docs/RELEASING.md)"
            exit 1
          fi
          if [ "$(jq '.deployment_branch_policy.custom_branch_policies' <<< "${config}")" != "true" ]; then
            echo "::error::the ${ENVIRONMENT} environment must admit selected tags only (docs/RELEASING.md)"
            exit 1
          fi
          policies=$(gh api --paginate "${api}/deployment-branch-policies" --jq '.branch_policies[] | "\(.type) \(.name)"')
          if [ "${policies}" != "tag ${TAG_PATTERN}" ]; then
            echo "::error::the ${ENVIRONMENT} environment must admit exactly the tag pattern ${TAG_PATTERN} (got: ${policies//$'\n'/, })"
            exit 1
          fi
          echo "${ENVIRONMENT}: ${reviewers} required reviewer(s), tags ${TAG_PATTERN} only"

  # Create the GitHub Release (with checksums.txt). Release notes are
  # auto-generated (ADR-0015: no CHANGELOG until 1.0). The job waits in the
  # release environment for a reviewer's approval, and it also checks the
  # npm-package artifact, so a swapped or roundtrip-damaged npm package
  # stops the release before the Release exists
  publish-github:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # npm staging lives inside the build job (a precondition via smoke). If it
    # is broken, build fails and the irreversible Release creation is never
    # reached
    needs: [verify, version-check, build, smoke, release-environment]
    environment: release
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: binaries
          path: binaries

      # Refuse anything the build job did not produce (see its digest step)
      - name: Verify the artifact is the build job's
        working-directory: binaries
        env:
          EXPECTED_DIGEST: ${{ needs.build.outputs.binaries-digest }}
        run: |
          set -euo pipefail
          digest() { (cd "$1" && find . ! -type d -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum --) | sha256sum | cut -d ' ' -f 1; }
          actual=$(digest .)
          if ! [[ "${EXPECTED_DIGEST}" =~ ^[0-9a-f]{64}$ ]] || [ "${actual}" != "${EXPECTED_DIGEST}" ]; then
            echo "::error::the downloaded artifact (digest ${actual}) is not the one the build job produced (${EXPECTED_DIGEST:-no digest})"
            exit 1
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-package
          path: npm-package

      # Refuse anything the build job did not produce (see its digest step)
      - name: Verify the artifact is the build job's
        working-directory: npm-package
        env:
          EXPECTED_DIGEST: ${{ needs.build.outputs.npm-package-digest }}
        run: |
          set -euo pipefail
          digest() { (cd "$1" && find . ! -type d -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum --) | sha256sum | cut -d ' ' -f 1; }
          actual=$(digest .)
          if ! [[ "${EXPECTED_DIGEST}" =~ ^[0-9a-f]{64}$ ]] || [ "${actual}" != "${EXPECTED_DIGEST}" ]; then
            echo "::error::the downloaded artifact (digest ${actual}) is not the one the build job produced (${EXPECTED_DIGEST:-no digest})"
            exit 1
          fi

      # Verify against an implementation (coreutils) independent of the
      # generator (node:crypto) before publishing
      - name: Verify checksums
        working-directory: binaries
        run: sha256sum -c checksums.txt

      - name: Create GitHub Release
        working-directory: binaries
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.version-check.outputs.prerelease }}
        run: |
          FLAGS=(--generate-notes --verify-tag)
          if [ "${PRERELEASE}" = "true" ]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            "${FLAGS[@]}" \
            maruhi-*.tar.gz checksums.txt

  # npm publish (unscoped `maruhi`). Auth is trusted publishing (OIDC) only:
  # no long-lived token in GitHub Secrets. provenance is forced via an
  # explicit flag (bun publish does not support provenance —
  # oven-sh/bun#15601 — so the npm CLI is used). id-token: write is granted
  # to this job alone, and only the pinned download-artifact action and the
  # SHA-256-pinned Node.js / npm run here (no checkout, no repository
  # dependency code). The job waits in the release environment for a
  # reviewer's approval of its own (checked by release-environment), and
  # npm's trusted-publisher entry names that environment, so no job outside
  # it, approved or not, can publish. Lifecycle scripts never run
  # (--ignore-scripts)
  publish-npm:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # build is the producer of the npm-package artifact (execution order is
    # already serialized via publish-github — this declares the dependency.
    # With only the implicit transitive dependency, a future change to
    # publish-github's needs would fail at download after the irreversible
    # Release creation)
    needs: [version-check, build, publish-github]
    environment: release
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      # Required for npm trusted publishing (OIDC) and provenance generation
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-package
          path: dist-npm

      # Refuse anything the build job did not produce (see its digest step)
      - name: Verify the artifact is the build job's
        working-directory: dist-npm
        env:
          EXPECTED_DIGEST: ${{ needs.build.outputs.npm-package-digest }}
        run: |
          set -euo pipefail
          digest() { (cd "$1" && find . ! -type d -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum --) | sha256sum | cut -d ' ' -f 1; }
          actual=$(digest .)
          if ! [[ "${EXPECTED_DIGEST}" =~ ^[0-9a-f]{64}$ ]] || [ "${actual}" != "${EXPECTED_DIGEST}" ]; then
            echo "::error::the downloaded artifact (digest ${actual}) is not the one the build job produced (${EXPECTED_DIGEST:-no digest})"
            exit 1
          fi

      # Node + npm come from the official tarball verified against a pinned
      # SHA-256 before anything in it runs, not from actions/setup-node: on
      # a tool-cache miss setup-node downloads Node without a digest check
      # and runs `node --version` / `npm --version` inside its own step,
      # where this job's OIDC request token is in the environment. Inline
      # (not a local action) because this job has no checkout. A Node bump
      # changes both values: the SHA-256 is the
      # node-v<version>-linux-x64.tar.gz line of the release's clearsigned
      # SHASUMS256.txt.asc, checked by gpgv against the active release keys
      # only (not a personal keyring, where any key would pass):
      #   curl -fsSLO https://raw.githubusercontent.com/nodejs/release-keys/main/gpg-only-active-keys/pubring.kbx
      #   rm -f shasums.txt
      #   gpgv --keyring ./pubring.kbx --output shasums.txt SHASUMS256.txt.asc &&
      #     grep ' node-v<version>-linux-x64.tar.gz$' shasums.txt
      # Pinned by apps/cli/test/workflows-supply-chain.test.ts
      - name: Install Node.js (pinned SHA-256, no cache)
        env:
          NODE_VERSION: "24.21.0"
          NODE_LINUX_X64_TARGZ_SHA256: "6e1db87ef58b8819e5d5402eff1536491b18edd8eb7bee5ef7897876e88dc5ff"
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS}" != "Linux" ] || [ "${RUNNER_ARCH}" != "X64" ]; then
            echo "::error::the pinned Node.js tarball is linux-x64 (got ${RUNNER_OS}/${RUNNER_ARCH})"
            exit 1
          fi
          archive="${RUNNER_TEMP}/node-linux-x64.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --retry 3 --retry-all-errors \
            --output "${archive}" \
            "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.gz"
          echo "${NODE_LINUX_X64_TARGZ_SHA256}  ${archive}" | sha256sum --check --strict
          node_dir="${RUNNER_TEMP}/node"
          mkdir -p "${node_dir}"
          tar -xzf "${archive}" -C "${node_dir}" --strip-components=1
          rm -f "${archive}"
          echo "${node_dir}/bin" >> "${GITHUB_PATH}"
          "${node_dir}/bin/node" --version

      # Trusted publishing requires npm >= 11.5.1. If unmet, stop earlier with
      # a clearer message than publish's authentication error
      - name: Ensure npm >= 11.5.1
        run: |
          node -e '
            const v = require("child_process").execSync("npm --version").toString().trim();
            const [maj, min, pat] = v.split(".").map(Number);
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1)));
            if (!ok) { console.error(`npm ${v} < 11.5.1: trusted publishing unavailable`); process.exit(1); }
            console.log(`npm ${v}`);
          '

      # upload/download-artifact does not preserve file modes (official docs),
      # so restore the staging-time executable bit here. Install-time bin is
      # chmod'ed by npm / bun so real harm is slight, but keep modes correct
      # inside the published tarball
      - name: Restore executable bit (lost in artifact roundtrip)
        run: chmod +x ./dist-npm/bin.js

      # npm silently rewrites the manifest via publish-time normalization
      # (auto-correct) and continues the publish with only a warning and
      # exit 0 (measured at v0.1.0-rc.1: both bins were stripped). The vitest
      # side can only pin "the input we pass", so npm-side rule changes are
      # made red here before publish
      - name: Reject npm-side manifest auto-correction (dry-run)
        env:
          DIST_TAG: ${{ needs.version-check.outputs.prerelease == 'true' && 'next' || 'latest' }}
        run: |
          set +e
          OUT=$(npm publish ./dist-npm --dry-run --ignore-scripts --tag "${DIST_TAG}" 2>&1)
          CODE=$?
          set -e
          echo "${OUT}"
          if [ "${CODE}" != "0" ]; then
            echo "::error::npm publish --dry-run itself failed (exit ${CODE})"
            exit 1
          fi
          if echo "${OUT}" | grep -q "auto-corrected"; then
            echo "::error::npm auto-corrected the manifest at publish time (bin etc. may be stripped; check the npm pkg fix diff)"
            exit 1
          fi

      - name: Publish to npm (provenance)
        env:
          # Prereleases (v0.1.0-rc.1 etc.) go to next without moving latest
          DIST_TAG: ${{ needs.version-check.outputs.prerelease == 'true' && 'next' || 'latest' }}
        # Always pass the path with ./: a bare `dist-npm` is interpreted by
        # npm as a registry package name and fails with ENOVERSIONS / E404
        # (verified with --dry-run)
        run: npm publish ./dist-npm --ignore-scripts --provenance --tag "${DIST_TAG}"
