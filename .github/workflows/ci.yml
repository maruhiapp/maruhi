# 品質ゲート(CLAUDE.md の 7 ステップと同一順序)+ web 統合ステップ
# 1. oxfmt → 2. oxlint → 3. tsc → 4. ImportLint → 5. fallow → 6. React Doctor → 7. テスト
# → 8. web ビルド(8d/8e = apex サイト)→ 9. web e2e / 9b. site e2e(wrangler dev + Playwright)→ 10. astryx doctor
# → 11. crypto 3 環境テスト(workerd / browser / Bun。CRYPTO_SPEC §11)
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # release.yml が publish 前の品質ゲートとしてこのファイルを丸ごと再利用する
  # (複製すると ci.yml の修正がリリース側に反映されず古いまま残るため)
  workflow_call:

# 既定の緩い権限に頼らない。テスト実行に必要なのは checkout のみ
permissions:
  contents: read

env:
  # 「言わざる」原則(CLAUDE.md)はメンテナ環境の CI にも適用する:
  # wrangler / alchemy / その他ツールのテレメトリを一括で無効化
  DO_NOT_TRACK: "1"
  WRANGLER_SEND_METRICS: "false"

jobs:
  check:
    runs-on: ubuntu-latest
    # workflow_call 経由でリリースのゲートにもなるため上限を明示する
    # (呼び出し側の release.yml は `uses:` job に timeout を掛けられない。
    # 実測 10〜15 分 + 余裕。既定の 360 分だと hang がリリースを 6 時間塞ぐ)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # React Doctor の diff モードと fallow audit が base ブランチとの比較を必要とする
          fetch-depth: 0
          # 以後のステップは checkout 済みのローカル履歴だけを見る(認証付き git
          # 操作はない)。依存・テストコードを走らせる job にトークンを残さない
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 既知脆弱性の監査(GHSA アドバイザリ照合)。厳密ピン留め運用は意図しない
      # 更新を防ぐ代わりに既知 CVE の放置に気づきにくいため、CI で常時検知する
      # --ignore は Blume(apps/site — ビルド時のみ動くメンテナ側ツールチェーン。配信物に
      # 載らない)の推移依存で、上流に修正版が無いもの(2026-09-03 時点。DP2 — PR #147):
      #   GHSA-w3rx-r6r6-pgpr / GHSA-5p2g-fcmc-qvqq: image-size@2.0.2(ICNS / JXL / HEIF の
      #     解析で無限ループ = DoS)。latest が 2.0.2 で修正版なし。Blume の画像最適化がビルド時に
      #     読むのは自リポジトリの PNG / SVG のみで、信頼できない画像を渡す経路がない
      #   GHSA-9wv6-86v2-598j: path-to-regexp@6.1.0(ReDoS)— @astrojs/vercel > @vercel/routing-utils
      #     の厳密ピン。Vercel へはデプロイしないため実行経路がない。名前単位の overrides で 6.3.0 に
      #     すると router(express 5 系、^8)まで巻き込むので採らない
      # いずれも Blume の更新で消える見込み。新しい advisory は引き続き検知する(ignore は ID 単位)
      - name: Audit (bun audit)
        run: >-
          bun audit
          --ignore GHSA-w3rx-r6r6-pgpr
          --ignore GHSA-5p2g-fcmc-qvqq
          --ignore GHSA-9wv6-86v2-598j

      - name: 1. Format (oxfmt)
        run: bun run fmt:check

      - name: 2. Lint (oxlint)
        run: bun run lint

      - name: 3. Typecheck (tsc)
        run: bun run typecheck

      - name: 4. ImportLint
        run: bunx import-lint --format github

      # fallow 3.22: 解析は 1 回だけ実行し、同じ JSON から CI 向け 2 形式を描画する。
      # annotations / summary 形式は fork PR でも write トークンなしで描画されるため、
      # PR コメント形式(要トークン)ではなくこちらを使う。ゲート判定(exit code)は
      # audit 本体のものを最後に返す
      - name: 5. fallow (baseline audit)
        run: |
          set +e
          bunx fallow audit --format json > "$RUNNER_TEMP/fallow-results.json"
          audit_status=$?
          set -e
          bunx fallow report --from "$RUNNER_TEMP/fallow-results.json" --format github-annotations
          bunx fallow report --from "$RUNNER_TEMP/fallow-results.json" --format github-summary >> "$GITHUB_STEP_SUMMARY"
          exit "$audit_status"

      - name: 6. React Doctor (web, diff mode)
        run: bun run doctor

      - name: 7. Test (Vitest)
        run: bun run test

      # 主実装(WebCrypto / panva hpke)と独立実装系(pyca 生成 + 参照検証
      # スクリプト)のクロスチェックを CI で継続化する(観点 7 — 従来は手動実行
      # のみで、主実装とベクターが揃って劣化しても検出できなかった)。tools は
      # ワークスペース外の独立プロジェクト(bunfig.toml)のためここで frozen
      # install する(数パッケージ・sub-second。実測で verify 含め 1 秒未満)
      - name: 7b. Crypto vectors cross-check (independent reference verifier)
        working-directory: packages/crypto/test-vectors/tools
        run: |
          bun install --frozen-lockfile
          bun run verify

      # web の e2e はビルド成果物(dist/public + _headers)前提のため、
      # ルート vitest.config.ts の projects には入れず独立ステップで実行する
      # (docs/notes/spike-a.md の推奨)。ポートは OS 割り当てで並列衝突しない。
      - name: 8. Web build (vite + CSP headers)
        run: bun run --filter @maruhi/web build

      # combined 配信構成(W2 裁定 BM — server が web アセットを同梱)の設定
      # 妥当性検査。credential 不要のローカル検証で、assets ディレクトリの実在・
      # wrangler.jsonc の整合をデプロイと同じ経路で確かめる(パス空間の被覆は
      # apps/server/test/serving-topology.test.ts が step 7 で検査済み)
      - name: 8b. Server deploy dry-run (combined assets config)
        run: bunx wrangler deploy --dry-run
        working-directory: apps/server
        env:
          WRANGLER_SEND_METRICS: "false"

      # 運用基盤 H3(docs/notes/hosted-ops.md §2-F): hosted 環境と復元 worker の設定も
      # 同じ経路で検査し、hosted 環境が最上位のバインディングから drift していない
      # ことを scripts/check-hosted-config.ts で確かめる
      - name: 8c. Hosted / restore config dry-run + drift check
        working-directory: apps/server
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          bunx wrangler deploy --dry-run --env hosted
          bunx wrangler deploy --dry-run -c wrangler.restore.jsonc
          bun scripts/check-hosted-config.ts

      # apex サイト(apps/site — Blume。LP + docs、DP2)。blume build + scripts/postbuild.ts
      # (style 属性の外部化・inline ハッシュの CSP・外部参照ゼロの機械検査・_headers)を
      # ビルドの経路で走らせ、独立 wrangler 設定(maruhi-site — Static Assets のみ)の妥当性を
      # 製品 Worker(8b)と同じ dry-run で検査する。Blume は bunx --bun で Bun 上で実行する
      # (Node 22.12+ の要求を CI の Node 版に依存させない — web-design-pass.md §4 裁定 J)
      - name: 8d. Site build (Blume + CSP headers)
        run: bun run --filter @maruhi/site build

      - name: 8e. Site deploy dry-run (static assets config)
        run: bunx wrangler deploy --dry-run
        working-directory: apps/site
        env:
          WRANGLER_SEND_METRICS: "false"

      # Playwright ブラウザ導入(step 9 / 9b / 11 の browser テストが共有)。
      # 旧構成(step 9 内で毎回 playwright install --with-deps)は step 9 の実測
      # 35s〜6m42s の変動要因だった。実測ログでの内訳: Chromium の実行ライブラリは
      # ubuntu-latest(実測時 ubuntu-24.04 noble イメージ)がすべて同梱済みで、
      # apt が新規に入れるのはフォント 9 個(21.1MB)のみ。その apt 取得が遅い
      # ミラーで 5 分超かかることがあり、これが変動の正体。フォント無しでも
      # e2e / crypto:browser が通ることを CI で実証済み(テストは DOM テキストと
      # computed style のみ検証し、字形描画に依存しない)ため --with-deps は
      # 使わない(イメージ更新で同梱が欠けた場合は playwright が欠落 .so 名を
      # 挙げて明示的に落ちるので、そのとき見直す)。
      # --only-shell: web e2e(chromium.launch headless)と crypto test:browser
      # (vitest browser provider、headless)は chromium headless shell だけで
      # 動くことを実測済み(フル Chromium は不要。取得量も約半分)。
      # ~/.cache/ms-playwright は playwright の厳密ピン版をキーにキャッシュし、
      # ミス時も headless shell の取得(数十 MB・数秒)だけで済む。ミス時の取得も
      # 速いがキャッシュは意図して維持する: ブラウザ CDN の変動・停滞という外部
      # 要因を平常経路から外すため(35s〜6m42s の変動の教訓)。
      # 導入を単一ステップに集約したので step 9 / 11 は常に同一 revision を使う。
      - name: Resolve Playwright version (browser cache key)
        id: playwright-version
        # fail-closed: 解決失敗時の bun --print は "undefined" を exit 0 で返すため、
        # 検証しないとキーが playwright-shell-Linux-undefined に固定され、以後の
        # バージョン更新でキャッシュが自己修復しなくなる(レビュー指摘)
        run: |
          version=$(bun --print 'require("./apps/web/package.json").devDependencies.playwright')
          case "$version" in "" | undefined) echo "::error::could not resolve the pinned playwright version"; exit 1 ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # restore / save を分離: 一体型 actions/cache の保存は post ステップ
      # (success() 条件)のため、ミス後に step 9〜11 のどれかが落ちると保存されず、
      # 赤いまま反復する開発中ブランチで毎回取り直しになる(レビュー指摘)。
      # 保存は導入ステップの直後に行い、後続の成否に依存させない
      - name: Restore Playwright Chromium cache (headless shell)
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          # キー名の "shell" はキャッシュ内容(headless shell のみ)を表す。
          # フル Chromium 導入へ戻す変更をする場合はキー名も変えること
          key: playwright-shell-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # working-directory は必須: ルート cwd の bunx はワークスペースのピンではなく
      # npm の latest を解決するため(docs/notes/session-04.md に既出の罠。レビューで
      # react-doctor の実測により再確認)、apps/web で実行してピン版に install させる。
      # これでキャッシュの中身(revision)とテストが要求する revision が常に一致する
      - name: Install Playwright Chromium (headless shell, cache miss only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        working-directory: apps/web
        run: bunx playwright install --only-shell chromium

      - name: Save Playwright Chromium cache (cache miss only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      # ステップ単位の timeout: ハング時(2026-08-19 run 32217317312 で実績)に
      # ジョブ上限 30 分ではなくステップ上限で早期に落とす(実測 + 余裕で設定)
      - name: 9. Web e2e (wrangler dev + Playwright)
        timeout-minutes: 5
        run: bun run --filter @maruhi/web e2e

      # apex サイトの e2e(wrangler dev + Playwright): 全リクエスト同一オリジン・CSP 違反ゼロ・
      # フォントの自己配信・light / dark の accent・/docs 到達・末尾スラッシュ / 404(step 8d の dist 前提)
      - name: 9b. Site e2e (wrangler dev + Playwright)
        timeout-minutes: 5
        run: bun run --filter @maruhi/site e2e

      - name: 10. Astryx doctor (web)
        run: bun run --filter @maruhi/web doctor:astryx

      # crypto の 3 環境実行(CRYPTO_SPEC §11)。ルート vitest.config.ts(step 7)は
      # packages/*/vitest.config.ts の glob で node プロジェクトのみを拾う。
      # workerd / browser はビルド外部依存(workerd バイナリ / Playwright Chromium)を
      # 要するため独立ステップで実行する。browser は上の Playwright 導入ステップが
      # 入れた headless shell(step 9 と同一 revision)を使う。
      - name: 11. Crypto multi-environment tests (workerd / browser / Bun)
        timeout-minutes: 10
        run: |
          bun run --filter @maruhi/crypto test:workerd
          bun run --filter @maruhi/crypto test:browser
          bun run --filter @maruhi/crypto test:bun
