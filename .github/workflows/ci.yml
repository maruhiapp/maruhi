# Quality gate (same order as the steps in CLAUDE.md) + web integration steps
# 0. English source check → 1. oxfmt → 2. oxlint → 3. tsc → 4. ImportLint →
# 5. fallow → 6. React Doctor → 7. tests → 8. web build (8d/8e = apex site)
# → 9. web e2e / 9b. site e2e (wrangler dev + Playwright) → 10. astryx doctor
# → 11. crypto 3-environment tests (workerd / browser / Bun — CRYPTO_SPEC §11)
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # release.yml reuses this whole file as its pre-publish quality gate
  # (duplicating it would leave the release side on a stale copy when ci.yml
  # changes)
  workflow_call:

# Cancel stale runs on consecutive pushes to the same PR (don't spend a runner
# on runs that will never be looked at). Non-PR runs (pushes to main,
# workflow_call from release.yml) get a per-run group so nothing is cancelled
# or replaced: pending entries in one group are superseded by newer runs, so
# putting main pushes in a shared group would silently drop CI for intermediate
# commits
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.ref) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Don't rely on the loose default permissions. Test execution only needs checkout
permissions:
  contents: read

env:
  # The "say nothing" principle (CLAUDE.md) applies to the maintainer-side CI
  # too: disable telemetry for wrangler / alchemy / other tools in one place
  DO_NOT_TRACK: "1"
  WRANGLER_SEND_METRICS: "false"

jobs:
  check:
    runs-on: ubuntu-latest
    # An explicit cap because this also gates releases via workflow_call
    # (the calling release.yml can't put a timeout on a `uses:` job.
    # Measured at 10–15 min + headroom. The 360-min default would let a hang
    # block a release for 6 hours)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # React Doctor's diff mode and fallow audit need to compare against
          # the base branch
          fetch-depth: 0
          # Later steps only read the checked-out local history (no
          # authenticated git operations). Don't leave a token in a job that
          # runs dependencies and test code
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # ADR-0019 ratchet: CJK text may not appear in files a PR touches
      # (exemptions: scripts/english-exemptions.txt + inline `english-exempt`
      # markers). Runs before install — the script has no dependencies
      - name: 0. English source check (changed files)
        run: bun run check:english

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The docs recipe checks (apps/site/test/unit/recipes.test.ts) run on every
      # installed shell (sh / bash / zsh / dash). ubuntu-latest has no zsh, so
      # install it (the page promises zsh by name, and the check asserts its
      # presence in CI — PR #153 revision 5)
      - name: Install zsh (docs recipe checks)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends zsh

      # Known-vulnerability audit (GHSA advisory matching). The strict-pinning
      # policy intentionally does not chase every update, so CI continuously
      # detects known CVEs left in place instead.
      # --ignore covers transitive deps of maintainer-side toolchains that only
      # run at build/test time and can't be fixed by an in-range update
      # (ignores are per-ID; new advisories still get detected):
      #   GHSA-w3rx-r6r6-pgpr / GHSA-5p2g-fcmc-qvqq: image-size@2.0.2 (infinite
      #     loop parsing ICNS / JXL / HEIF = DoS). latest is 2.0.2 with no fix
      #     release. Blume's image optimization only reads our own repo's
      #     PNG / SVG at build time — no path for untrusted images
      #     (as of 2026-09-03. DP2 — PR #147. Expected to disappear with a Blume
      #     update)
      #   GHSA-9wv6-86v2-598j: path-to-regexp@6.1.0 (ReDoS) — a strict pin via
      #     @astrojs/vercel > @vercel/routing-utils. No deploys to Vercel means
      #     no execution path. A name-scoped override to 6.3.0 would drag in
      #     router (express 5 line, ^8), so it is not taken (same source)
      #   GHSA-rgj7-g3m4-5g8c: sharp@0.35.2 (vulnerability in the bundled
      #     libheif; fixed in 0.35.4) — miniflare fully pins 0.35.2, so an
      #     in-range update can't fix it (bun audit fix doesn't help).
      #     miniflare is test/dev-only via @cloudflare/vitest-plugin /
      #     wrangler dev: no path feeds it an untrusted HEIF image and it never
      #     ships. The sharp under blume > astro is already 0.35.4. Expected to
      #     disappear with a wrangler / miniflare update (as of 2026-09-08.
      #     PR #161)
      - name: Audit (bun audit)
        run: >-
          bun audit
          --ignore GHSA-w3rx-r6r6-pgpr
          --ignore GHSA-5p2g-fcmc-qvqq
          --ignore GHSA-9wv6-86v2-598j
          --ignore GHSA-rgj7-g3m4-5g8c

      - name: 1. Format (oxfmt)
        run: bun run fmt:check

      - name: 2. Lint (oxlint)
        run: bun run lint

      - name: 3. Typecheck (tsc)
        run: bun run typecheck

      - name: 4. ImportLint
        run: bunx import-lint --format github

      # fallow 3.22: run the analysis once and render two CI-facing formats from
      # the same JSON. The annotations / summary formats render even on fork PRs
      # with no write token, so they are used instead of the PR-comment format
      # (which needs one). The gate verdict (exit code) is the audit's own,
      # returned last
      - name: 5. fallow (baseline audit)
        run: |
          set +e
          bunx fallow audit --format json > "$RUNNER_TEMP/fallow-results.json"
          audit_status=$?
          set -e
          bunx fallow report --from "$RUNNER_TEMP/fallow-results.json" --format github-annotations
          bunx fallow report --from "$RUNNER_TEMP/fallow-results.json" --format github-summary >> "$GITHUB_STEP_SUMMARY"
          exit "$audit_status"

      - name: 6. React Doctor (web, diff mode)
        run: bun run doctor

      - name: 7. Test (Vitest)
        run: bun run test

      # Keeps the cross-check between the main implementation (WebCrypto /
      # panva hpke) and the independent implementation line (pyca-generated +
      # reference verifier scripts) running in CI (consideration 7 — it used to
      # be manual-only, so a joint degradation of impl and vectors could not be
      # detected). tools is an independent project outside the workspace
      # (bunfig.toml), so it gets its own frozen install here (a few packages,
      # sub-second; under 1s including verify in measurement)
      - name: 7b. Crypto vectors cross-check (independent reference verifier)
        working-directory: packages/crypto/test-vectors/tools
        run: |
          bun install --frozen-lockfile
          bun run verify

      # The web e2e assumes build artifacts (dist/public + _headers), so it is
      # not in the root vitest.config.ts projects and runs as its own step
      # (recommended in docs/notes/spike-a.md). The port is OS-assigned so
      # parallel runs don't collide.
      - name: 8. Web build (vite + CSP headers)
        run: bun run --filter @maruhi/web build

      # Config validity check for the combined serving layout (W2 ruling BM —
      # server bundles the web assets). A credential-free local verification
      # that follows the same path as a deploy to confirm the assets directory
      # exists and wrangler.jsonc is consistent (path-space coverage is checked
      # by apps/server/test/serving-topology.test.ts in step 7)
      - name: 8b. Server deploy dry-run (combined assets config)
        run: bunx wrangler deploy --dry-run
        working-directory: apps/server
        env:
          WRANGLER_SEND_METRICS: "false"

      # Ops foundation H3 (docs/notes/hosted-ops.md §2-F): check the hosted
      # environment and the restore worker through the same path, and confirm
      # via scripts/check-hosted-config.ts that the hosted environment has not
      # drifted from the outermost bindings
      - name: 8c. Hosted / restore config dry-run + drift check
        working-directory: apps/server
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          bunx wrangler deploy --dry-run --env hosted
          bunx wrangler deploy --dry-run -c wrangler.restore.jsonc
          bun scripts/check-hosted-config.ts

      # apex site (apps/site — Blume. LP + docs, DP2). Runs blume build +
      # scripts/postbuild.ts (style-attribute externalization, inline-hash CSP,
      # zero-external-reference mechanical checks, _headers) through the build
      # path, then validates the standalone wrangler config (maruhi-site —
      # Static Assets only) with the same dry-run as the product Worker (8b).
      # Blume runs on Bun via bunx --bun (avoids depending on the CI's Node
      # version for its Node 22.12+ requirement — web-design-pass.md §4 ruling J)
      - name: 8d. Site build (Blume + CSP headers)
        run: bun run --filter @maruhi/site build

      # Validates internal links / anchors / asset references (Blume's
      # validate. --external is not passed and external URLs are never hit —
      # "say nothing" applies to CI too). --strict also fails on warnings
      - name: 8d2. Site link validation (blume validate)
        run: bun run --filter @maruhi/site validate

      - name: 8e. Site deploy dry-run (static assets config)
        run: bunx wrangler deploy --dry-run
        working-directory: apps/site
        env:
          WRANGLER_SEND_METRICS: "false"

      # Playwright browser install (shared by the browser tests in step 9 / 9b /
      # 11). The old layout (playwright install --with-deps inside step 9 every
      # run) accounted for the measured 35s–6m42s variance of step 9. Breakdown
      # from measured logs: ubuntu-latest (ubuntu-24.04 noble image at the time)
      # already ships all of Chromium's runtime libraries; apt only installs 9
      # fonts (21.1MB). That apt fetch can take 5+ minutes on a slow mirror —
      # the actual source of the variance. e2e / crypto:browser were proven to
      # pass without the fonts in CI (tests verify DOM text and computed style
      # only, not glyph rendering), so --with-deps is not used (if an image
      # update drops a bundled .so, playwright fails loudly naming the missing
      # .so — revisit then).
      # --only-shell: the web e2e (chromium.launch headless) and crypto
      # test:browser (vitest browser provider, headless) were measured to work
      # on the chromium headless shell alone (full Chromium is unnecessary and
      # roughly halves the download).
      # ~/.cache/ms-playwright is cached keyed by the strictly pinned playwright
      # version, so a miss only fetches the headless shell (tens of MB, seconds).
      # The miss path is also fast, but the cache is kept deliberately: it moves
      # browser-CDN variance and stalls off the normal path (the 35s–6m42s
      # lesson).
      # Consolidating install into a single step means steps 9 / 11 always use
      # the same revision.
      - name: Resolve Playwright version (browser cache key)
        id: playwright-version
        # fail-closed: bun --print returns "undefined" with exit 0 when
        # resolution fails, so without validation the key would pin to
        # playwright-shell-Linux-undefined and later version bumps would stop
        # self-healing the cache (review feedback)
        # The install step only uses apps/web's pin, but site e2e (9b) shares
        # the browser. If the two pins diverge, stop here with a reason (before
        # the browser-not-installed error downstream)
        run: |
          version=$(bun --print 'require("./apps/web/package.json").devDependencies.playwright')
          case "$version" in "" | undefined) echo "::error::could not resolve the pinned playwright version"; exit 1 ;; esac
          site_version=$(bun --print 'require("./apps/site/package.json").devDependencies.playwright')
          if [ "$site_version" != "$version" ]; then
            echo "::error::playwright pins differ: apps/web $version, apps/site $site_version (keep them equal)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # restore / save are split: the combined actions/cache only saves in its
      # post step (success() condition), so if any of steps 9–11 fails after a
      # miss, nothing is saved and a red development branch re-fetches every
      # run (review feedback). Saving happens right after the install step and
      # does not depend on later outcomes
      - name: Restore Playwright Chromium cache (headless shell)
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          # The "shell" in the key name describes the cache contents (headless
          # shell only). If the layout ever goes back to full Chromium, change
          # the key name too
          key: playwright-shell-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # working-directory is required: bunx at the repo root resolves npm's
      # latest instead of the workspace pin (a known trap already recorded in
      # docs/notes/session-04.md; re-confirmed by react-doctor measurement in
      # review). Running in apps/web makes it install the pinned version. This
      # keeps the cached contents (revision) and the revision the tests require
      # always equal
      - name: Install Playwright Chromium (headless shell, cache miss only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        working-directory: apps/web
        run: bunx playwright install --only-shell chromium

      - name: Save Playwright Chromium cache (cache miss only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      # Per-step timeout: on a hang (actual incident on 2026-08-19, run
      # 32217317312), fail fast on the step limit rather than the 30-minute job
      # limit (set to measured time + headroom)
      - name: 9. Web e2e (wrangler dev + Playwright)
        timeout-minutes: 5
        run: bun run --filter @maruhi/web e2e

      # apex site e2e (wrangler dev + Playwright): every request same-origin,
      # zero CSP violations, self-hosted fonts, light/dark accent, /docs
      # reachable, trailing-slash / 404 (assumes the dist from step 8d)
      - name: 9b. Site e2e (wrangler dev + Playwright)
        timeout-minutes: 5
        run: bun run --filter @maruhi/site e2e

      - name: 10. Astryx doctor (web)
        run: bun run --filter @maruhi/web doctor:astryx

      # crypto's 3-environment runs (CRYPTO_SPEC §11). The root
      # vitest.config.ts (step 7) only picks up node projects via the
      # packages/*/vitest.config.ts glob. workerd / browser need out-of-build
      # dependencies (the workerd binary / Playwright Chromium), so they run as
      # their own step. browser uses the headless shell installed by the
      # Playwright step above (same revision as step 9).
      - name: 11. Crypto multi-environment tests (workerd / browser / Bun)
        timeout-minutes: 10
        run: |
          bun run --filter @maruhi/crypto test:workerd
          bun run --filter @maruhi/crypto test:browser
          bun run --filter @maruhi/crypto test:bun
