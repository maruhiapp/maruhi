# 品質ゲート(CLAUDE.md の 7 ステップと同一順序)+ web 統合ステップ
# 1. oxfmt → 2. oxlint → 3. tsc → 4. ImportLint → 5. fallow → 6. React Doctor → 7. テスト
# → 8. web ビルド → 9. web e2e(wrangler dev + Playwright)→ 10. astryx doctor
# → 11. crypto 3 環境テスト(workerd / browser / Bun。CRYPTO_SPEC §11)
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # release.yml が publish 前の品質ゲートとしてこのファイルを丸ごと再利用する
  # (複製すると ci.yml の修正がリリース側に反映されず古いまま残るため)
  workflow_call:

# 既定の緩い権限に頼らない。テスト実行に必要なのは checkout のみ
permissions:
  contents: read

env:
  # 「言わざる」原則(CLAUDE.md)はメンテナ環境の CI にも適用する:
  # wrangler / alchemy / その他ツールのテレメトリを一括で無効化
  DO_NOT_TRACK: "1"
  WRANGLER_SEND_METRICS: "false"

jobs:
  check:
    runs-on: ubuntu-latest
    # workflow_call 経由でリリースのゲートにもなるため上限を明示する
    # (呼び出し側の release.yml は `uses:` job に timeout を掛けられない。
    # 実測 10〜15 分 + 余裕。既定の 360 分だと hang がリリースを 6 時間塞ぐ)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # React Doctor の diff モードと fallow audit が base ブランチとの比較を必要とする
          fetch-depth: 0
          # 以後のステップは checkout 済みのローカル履歴だけを見る(認証付き git
          # 操作はない)。依存・テストコードを走らせる job にトークンを残さない
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 既知脆弱性の監査(GHSA アドバイザリ照合)。厳密ピン留め運用は意図しない
      # 更新を防ぐ代わりに既知 CVE の放置に気づきにくいため、CI で常時検知する
      - name: Audit (bun audit)
        run: bun audit

      - name: 1. Format (oxfmt)
        run: bun run fmt:check

      - name: 2. Lint (oxlint)
        run: bun run lint

      - name: 3. Typecheck (tsc)
        run: bun run typecheck

      - name: 4. ImportLint
        run: bunx import-lint --format github

      - name: 5. fallow (baseline audit)
        run: bun run fallow:audit

      - name: 6. React Doctor (web, diff mode)
        run: bun run doctor

      - name: 7. Test (Vitest)
        run: bun run test

      # web の e2e はビルド成果物(dist/public + _headers)前提のため、
      # ルート vitest.config.ts の projects には入れず独立ステップで実行する
      # (docs/notes/spike-a.md の推奨)。ポートは OS 割り当てで並列衝突しない。
      - name: 8. Web build (vite + CSP headers)
        run: bun run --filter @maruhi/web build

      # Playwright ブラウザ導入(step 9 と 11 の browser テストが共有)。
      # 旧構成(step 9 内で毎回 playwright install --with-deps)はブラウザ取得
      # (約 170MB)+ apt が step 9 の実測 35s〜6m42s の変動要因だったため、
      # ~/.cache/ms-playwright を playwright の厳密ピン版をキーにキャッシュする。
      # --only-shell: web e2e(chromium.launch headless)と crypto test:browser
      # (vitest browser provider、headless)は chromium headless shell だけで
      # 動くことを実測済み(フル Chromium は不要。取得量も約半分)。
      # --with-deps(apt)はキャッシュミス時のみ: ubuntu-latest はブラウザ実行に
      # 必要な OS ライブラリを同梱しており、ヒット時はそれで足りる(CI で実証)。
      # 導入を単一ステップに集約したので step 9 / 11 は常に同一 revision を使う。
      - name: Resolve Playwright version (browser cache key)
        id: playwright-version
        run: echo "version=$(bun --print 'require("./apps/web/package.json").devDependencies.playwright')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium (headless shell, cache miss only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: bunx playwright install --with-deps --only-shell chromium

      # ステップ単位の timeout: ハング時(2026-08-19 run 32217317312 で実績)に
      # ジョブ上限 30 分ではなくステップ上限で早期に落とす(実測 + 余裕で設定)
      - name: 9. Web e2e (wrangler dev + Playwright)
        timeout-minutes: 5
        run: bun run --filter @maruhi/web e2e

      - name: 10. Astryx doctor (web)
        run: bun run --filter @maruhi/web doctor:astryx

      # crypto の 3 環境実行(CRYPTO_SPEC §11)。ルート vitest.config.ts(step 7)は
      # packages/*/vitest.config.ts の glob で node プロジェクトのみを拾う。
      # workerd / browser はビルド外部依存(workerd バイナリ / Playwright Chromium)を
      # 要するため独立ステップで実行する。browser は上の Playwright 導入ステップが
      # 入れた headless shell(step 9 と同一 revision)を使う。
      - name: 11. Crypto multi-environment tests (workerd / browser / Bun)
        timeout-minutes: 10
        run: |
          bun run --filter @maruhi/crypto test:workerd
          bun run --filter @maruhi/crypto test:browser
          bun run --filter @maruhi/crypto test:bun
