name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.ref) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DO_NOT_TRACK: "1"
  WRANGLER_SEND_METRICS: "false"
  CF_SEND_TELEMETRY: "false"
  PLAYWRIGHT_DOWNLOAD_HOST: "https://playwright-download.invalid"

jobs:
  static:
    name: Static gates
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Lint GitHub Actions workflows (jactionlint, pinned SHA-256)
        run: |
          set -euo pipefail
          bash scripts/install-jactionlint.sh linux-x64 "${RUNNER_TEMP}/jactionlint-bin"
          command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends shellcheck; }
          "${RUNNER_TEMP}/jactionlint-bin/jactionlint"

      - uses: ./.github/actions/install-bun

      # ADR-0019: no tracked file may contain CJK text (exemptions:
      # scripts/english-exemptions.txt + inline `english-exempt` markers).
      # Whole-tree mode since the migration finished. Runs before install —
      # the script has no dependencies
      - name: 0. English source check (whole tree)
        run: bun run check:english

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - parallel:
          # Known-vulnerability audit (GHSA advisory matching). The strict-pinning
          # policy intentionally does not chase every update, so CI continuously
          # detects known CVEs left in place instead.
          # --ignore covers transitive deps of maintainer-side toolchains that only
          # run at build/test time and can't be fixed by an in-range update
          # (ignores are per-ID; new advisories still get detected):
          #   GHSA-g3hv-75wg-m249: minimatch@10.2.6 (globparts amplification
          #     DoS) via eslint, @eslint/config-array and glob, all pinning ^10;
          #     the fix (minimatch@11) is out of range for every parent and the
          #     latest eslint still pins ^10 — lint/build-time pattern matching
          #     over the repository's own file paths only
          #   GHSA-fc5q-39xc-vjpf: picomatch (ReDoS through single-branch
          #     repeated extglobs) — every copy in the tree (2.3.2 / 4.0.5 /
          #     4.0.7, via alchemy, astro, vitest, vite and friends) is in the
          #     vulnerable range <= 4.0.7 and upstream has published no patched
          #     release (advisory of 2026-10-19, first_patched_version null;
          #     the latest releases are still 2.3.2 / 4.0.7) — build/test-time
          #     glob matching over the repository's own paths only. Remove
          #     this ignore when a patched picomatch ships.
          # Removed as stale (2026-11-14): the path-to-regexp@6.1.0 ignore
          # (GHSA-9wv6-86v2-598j — the tree's only copy is 6.3.0 since the
          # Blume → Nimbus replacement, ADR-0008 revision 2), the katex ignore
          # (GHSA-238p-pmpm-9mq7 — mermaid / katex left the tree with Blume),
          # the postcss-selector-parser@6 ignore (GHSA-rj75-hqrm-r3gf — the
          # tree's only copy is 7.1.6) and the glob@13 ignore
          # (GHSA-3g3m-2fjr-6pw4 — @vercel/nft left the tree with Blume).
          # Removed as stale (2026-10-23): the braces@3.0.3 ignore
          # (GHSA-vfj7-8cjw-p6xm) — GitHub withdrew the advisory on 2026-10-23,
          # so bun audit no longer reports it.
          # Removed as stale (2026-10-23): the sprintf-js@1.0.3 ignore
          # (GHSA-hp3w-g68c-fv3c) — GitHub withdrew the advisory on 2026-10-22,
          # so bun audit no longer reports it.
          # Removed as stale (2026-10-06): the http-cache-semantics@4.2.0 ignore
          # (GHSA-ch52-4w7c-c8xp) — every copy is 4.3.0 since `bun audit fix`.
          # Removed as stale (2026-09-30): the image-size@2.0.2 ignores
          # (GHSA-w3rx-r6r6-pgpr / GHSA-5p2g-fcmc-qvqq — image-size left the tree
          # with a Blume update) and the sharp@0.35.2 ignore (GHSA-rgj7-g3m4-5g8c —
          # every sharp is 0.35.4 since the miniflare update). An ignore for a
          # package no longer present would silently pass the same advisory if it
          # came back
          - name: Audit (bun audit)
            run: >-
              bun audit
              --ignore GHSA-g3hv-75wg-m249
              --ignore GHSA-fc5q-39xc-vjpf

          - name: 1. Format (vp fmt)
            run: bun run fmt:check

          - name: 2. Lint (vp lint, type-aware + Effect diagnostics, warnings fail)
            run: bun run lint

          - name: 3. Typecheck (vp check)
            run: bun run typecheck

          - name: 4. ImportLint
            run: bunx import-lint --format github

          - name: 5. fallow (baseline audit)
            run: |
              set +e
              bunx fallow audit --format json > "$RUNNER_TEMP/fallow-results.json"
              audit_status=$?
              set -e
              bunx fallow report --from "$RUNNER_TEMP/fallow-results.json" --format github-annotations
              bunx fallow report --from "$RUNNER_TEMP/fallow-results.json" --format github-summary >> "$GITHUB_STEP_SUMMARY"
              exit "$audit_status"

          - name: 5a. fallow whole-project baselines (stale-baseline gate)
            run: bun run fallow:baselines

          - name: 5b. fallow dupes baseline (shrink-only)
            env:
              BASE_REF: ${{ github.base_ref }}
            run: bun scripts/check-dupes-baseline.mjs "origin/${BASE_REF:-main}"

          - name: 6. React Doctor (web, full scan)
            run: bun run doctor

          - name: 10. Astryx doctor (web)
            run: bun run --filter @maruhi/web doctor:astryx

  server:
    name: Test — server (Vitest, workerd), shard ${{ matrix.shard }}/4
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/install-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: 7h. Test — server (Vitest, workerd) — shard ${{ matrix.shard }}/4
        run: bun scripts/test-suite.mjs run server --shard=${{ matrix.shard }}/4

  cli:
    name: Test — cli (Vitest), shard ${{ matrix.shard }}/2
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/install-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: 7g. Test — cli (Vitest) — shard ${{ matrix.shard }}/2
        run: bun scripts/test-suite.mjs run cli --shard=${{ matrix.shard }}/2

  unit:
    name: Test — packages + app unit (Vitest)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/install-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install apt packages (zsh for the docs recipe checks)
        run: >-
          sudo apt-get update -qq &&
          sudo apt-get install -y --no-install-recommends zsh

      - parallel:
          - name: 7e. Test — packages (Vitest)
            run: bun run test:packages

          - name: 7f. Test — app unit (Vitest)
            run: bun run test:app-unit

  crypto:
    name: Crypto vectors cross-check + regeneration
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/install-bun

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          (cd packages/crypto/test-vectors/tools && bun install --frozen-lockfile)

      - name: Install apt packages (pyca for 7c)
        run: >-
          sudo apt-get update -qq &&
          sudo apt-get install -y --no-install-recommends python3-cryptography
      - name: 7b. Crypto vectors cross-check (independent reference verifier)
        working-directory: packages/crypto/test-vectors/tools
        run: bun run verify

      - name: 7c. Crypto vectors regeneration check
        working-directory: packages/crypto/test-vectors/tools
        run: bun run regen-check

      - name: 7d. Crypto change review aid (PR only, job summary)
        if: github.event_name == 'pull_request'
        working-directory: packages/crypto/test-vectors/tools
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bun run delta -- --base "$BASE_SHA" --head HEAD >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: Builds + e2e (web / site / crypto browser)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Chrome Headless Shell (pinned SHA-256, no cache)
        id: headless-shell
        background: true
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if ! executable="$(bash scripts/install-headless-shell.sh)"; then
            exit 1
          fi
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=${executable}" >> "${GITHUB_ENV}"

      - uses: ./.github/actions/install-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - parallel:
          - name: 8. Web build (vite + CSP headers)
            run: bun run --filter @maruhi/web build

          - name: 8d. Site build (Nimbus + CSP headers)
            run: bun run --filter @maruhi/site build

      - wait: headless-shell

      - parallel:
          - name: 8b/8c. Server deploy dry-runs + drift check (combined / restore)
            working-directory: apps/server
            run: |
              bunx cf deploy --dry-run
              bunx cf deploy --dry-run --mode restore
              bun scripts/check-hosted-config.ts

          - name: 8d2. Site content validation (nimbus-docs lint)
            run: bun run --filter @maruhi/site validate

      - parallel:
          - name: 9. Web e2e (cf dev + Playwright)
            timeout-minutes: 5
            run: bun run --filter @maruhi/web e2e

          - name: 9b. Site e2e (cf dev + Playwright)
            timeout-minutes: 5
            run: bun run --filter @maruhi/site e2e

          - name: 11. Crypto multi-environment tests (workerd / browser / Bun)
            timeout-minutes: 10
            run: |
              bun run --filter @maruhi/crypto test:workerd
              bun run --filter @maruhi/crypto test:browser
              bun run --filter @maruhi/crypto test:bun

      - name: 9c. CLI e2e (cf dev + the CLI)
        timeout-minutes: 5
        run: bun run --filter @maruhi/cli e2e
