# install-bun — installs the Bun that `.bun-version` pins, for this
# repository's own workflows (ci / installer / release / ops-backup).
#
# The install itself is scripts/install-bun.sh, shared with the dev
# environments: it holds the pinned SHA-256s and verifies the official release
# zip before anything in it runs, and no Actions cache is read or written. Do
# not go back to oven-sh/setup-bun: it caches the executable under a key any
# run in the default-branch scope can seed, and its only check runs the
# restored binary (`bun --revision`). On the release path this binary also
# becomes the runtime inside the published linux-x64 binary (`bun build
# --compile` for the host target copies the running executable), so this step
# refuses a runner without AVX2 instead of letting the script fall back to the
# baseline build.

name: "install-bun"
description: >-
  Install the Bun version pinned by .bun-version from the official release
  zip, verified against a pinned SHA-256, with no Actions cache.

runs:
  using: "composite"
  steps:
    - name: Install Bun (pinned SHA-256, no cache)
      shell: bash
      run: |
        set -euo pipefail
        if [ "${RUNNER_OS}" = "Linux" ] && ! grep -qw avx2 /proc/cpuinfo; then
          echo "::error::this runner has no AVX2; the release needs the non-baseline bun-linux-x64 build"
          exit 1
        fi
        bash "${GITHUB_WORKSPACE}/scripts/install-bun.sh"
        echo "${HOME}/.bun/bin" >> "${GITHUB_PATH}"
